[package]
name = "snake"
version = "1.0.0"
edition = "2024"
description = "A polished, single-player Snake game built with Rust and macroquad"
repository = "https://github.com/Sadman-Ishtiak/snake"
readme = "README.md"
publish = false

[dependencies]
macroquad = "0.4"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
