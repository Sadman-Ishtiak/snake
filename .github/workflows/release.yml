name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build the packages for all platforms and leave them as
  # downloadable workflow artifacts (no GitHub release is created).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Intel and Apple Silicon targets
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Add target
        if: matrix.target != 'universal-apple-darwin'
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build (Linux / Windows)
        if: matrix.target != 'universal-apple-darwin'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          PKG="snake-${VERSION}-linux-x86_64"
          mkdir -p "dist/$PKG"
          cp "target/x86_64-unknown-linux-gnu/release/snake" "dist/$PKG/"
          cp README.md packaging/snake.desktop packaging/snake.png packaging/install-linux.sh "dist/$PKG/"
          chmod +x "dist/$PKG/snake" "dist/$PKG/install-linux.sh"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          PKG="snake-${VERSION}-windows-x86_64"
          mkdir -p "dist/$PKG"
          cp "target/x86_64-pc-windows-msvc/release/snake.exe" "dist/$PKG/"
          cp README.md "dist/$PKG/"
          SEVENZIP="$(command -v 7z || echo '/c/Program Files/7-Zip/7z.exe')"
          "$SEVENZIP" a "dist/$PKG.zip" "dist/$PKG" > /dev/null

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          PKG="snake-${VERSION}-macos-universal"
          APP="dist/Snake.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create \
            target/x86_64-apple-darwin/release/snake \
            target/aarch64-apple-darwin/release/snake \
            -output "$APP/Contents/MacOS/snake"
          chmod +x "$APP/Contents/MacOS/snake"
          cp packaging/snake.icns "$APP/Contents/Resources/snake.icns"
          sed "s/__VERSION__/${VERSION}/g" packaging/Info.plist > "$APP/Contents/Info.plist"
          # Ad-hoc signature: required for unsigned binaries to run on Apple Silicon.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "dist/$PKG.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
